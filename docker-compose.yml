services:
    
  prometheus:
    build:
      context: .
      dockerfile: prometheus/dockerfile
    user: root # required for data persistence
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus

  loki:
    build:
      context: .
      dockerfile: loki/dockerfile
    user: root # required for data persistence
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  tempo: 
    build:
      context: .
      dockerfile: tempo/dockerfile
    user: root # required for data persistence
    ports:
      - "127.0.0.1:3200:3200" # http server for querying
      - "127.0.0.1:4317:4317" # grpc server for ingest
      - "127.0.0.1:4318:4318" # http server for ingest
    volumes:
      - tempo_data:/var/tempo

  grafana:
    build:
      context: .
      dockerfile: grafana/dockerfile
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD to a unique Grafana admin password}
      - GF_DEFAULT_INSTANCE_NAME=Grafana
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - LOKI_INTERNAL_URL=http://loki:3100
      - PROMETHEUS_INTERNAL_URL=http://prometheus:9090
      - TEMPO_INTERNAL_URL=http://tempo:3200
  
  example_api: 
    build:
      context: ./examples/api
      dockerfile: dockerfile
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      - TEMPO_URL=http://tempo:4318
      - TEMPO_SERVICE_NAME=example_api

volumes: 
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data: