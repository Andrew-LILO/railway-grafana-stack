global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ocr-extraction-api'
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ['web.railway.internal:8000']